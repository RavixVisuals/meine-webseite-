<!DOCTYPE html> 
<html lang="de"> 
  <head>
<meta charset="UTF-8"> 
    <title>Ravix Visuals</title>
    <style>
      body { 
      background-color: #0f0f13; 
      color: #ffffff; 
      font-family: sans-serif;
      text-align: center;
      padding-top: 150px;
      }
      h1 { 
        color: #00f2fe;
        text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        font-size: 4rem: /* 4rem ist riesig und fett! */ 
        margin-bottom: 5px; /* Schiebt den Text darunter näher ran */ 
      }
      .mein-button { 
        background: linear-gradient(45deg, #00f2fe, #4facfe);
                                    color: black;
        font-weight: bold;
        padding: 15px 35px;
        border: none;
        border-radius: 50px;
        cursor. pointer;
        transition: 0.3s;
      }
      .mein-button:hover {
        transform: scale(1.1);
      }
      </style> 
  </head>
  <body>
    <h1>Ravix Visuals</h1>
    <p>Hier entsteht gerade etwas Großes.</p>
      <button class="mein-button" onclick="alert('Geil, es funktioniert!') ">Klick mich!</button>
        </body> 
      </html>
