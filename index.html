<!DOCTYPE html> 
<html lang="de"> 
  <head>
<meta charset="UTF-8"> 
    <title>Ravix Visuals</title>
    <style>
      body { 
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        text-align. center;
        background-color: #232526;
        color: #e2e8f0;
        overflow-x: hidden;

        background: linear-gradient(180deg, #232526, #1a1c1d),
          repeating-linear-gradient (45deg,
          rgba(255, 215, 0, 0.03) 0px,
          rgba(255, 215, 0, 0.03) 2px,
          transparent 2px,
          transparent 40px);
        background-size: 200% 200%;
        animation: hintergrundBewegung 30s linear infinite;
      }
      @keyframes hintergrundBewegung {
        0% { background-position: 0% 0%; }
        100% { background-position: 100% 100% }
      }
      .sektion {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px;
        box-sizing: border-box;
      }
      h1 {
        color: #ffd700;
        text-shadow: 0 0 35px rgba(o, 242, 254, 0.7);
        font-size: 10rem;
        margin-bottom: 10px;
        font-weight: 900;
      }
      p {
        color: #8f9cae;
        font-size: 3rem;
        margin-bottom: 80px;
      }
      .mein-button {
        background: #000000;
        color: #ffd700;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        font-weight: bold;
        font-size: 3.5rem;
        padding: 35px 90px;
        border: none;
        border-radius: 100px;
        cursor; pointer;
        transition; 0.3s;
      }
      .mein-button:hover {
        transform: scale 1.15);
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
      }
      </style> 
  </head>
  <body>
    <h1>Ravix Visuals</h1>
    <p>Hier entsteht gerade etwas Großes.</p>
      <button class="mein-button" onclick="alert('Geil, es funktioniert!') ">Klick mich!</button>
        </body> 
      </html>
