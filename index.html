<!DOCTYPE html> 
<html lang="de"> 
  <head>
<meta charset="UTF-8"> 
    <title>Ravix Visuals</title>
    <style>
      body { 
        background: linear-gradient(180deg; #232526. #ffffff);
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: #ffffff;
        font-family: sans-serif;
        text-align: center;
        padding-top: 250px;
      }
      h1 {
        color: #00f2fe;
        text-shadow: 0 0 35px rgba(o, 242, 254, 0.7);
        font-size: 10rem;
        margin-bottom: 10px;
        font-weight: 900;
      }
      p {
        color: #8f9cae;
        font-size: 3rem;
        margin-bottom: 80px;
      }
      .mein-button {
        background: #000000;
        color: #ffd700;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        font-weight: bold;
        font-size: 3.5rem;
        padding: 35px 90px;
        border: none;
        border-radius: 100px;
        cursor; pointer;
        transition; 0.3s;
      }
      .mein-button:hover {
        transform: scale 1.15);
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
      }
      </style> 
  </head>
  <body>
    <h1>Ravix Visuals</h1>
    <p>Hier entsteht gerade etwas Großes.</p>
      <button class="mein-button" onclick="alert('Geil, es funktioniert!') ">Klick mich!</button>
        </body> 
      </html>
